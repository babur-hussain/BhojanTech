# Nginx configuration for Restaurant System
# Place in /etc/nginx/sites-available/restaurant-system and symlink to sites-enabled

upstream backend_nodes {
    # PM2 cluster handles load balancing among the 4 workers internally when listening on this port.
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name myrestaurantapp.com www.myrestaurantapp.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name myrestaurantapp.com www.myrestaurantapp.com;

    # SSL Configuration (using Let's Encrypt / AWS ACM if load balancer is placed in front)
    # If using EC2 directly with Let's Encrypt:
    ssl_certificate /etc/letsencrypt/live/myrestaurantapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myrestaurantapp.com/privkey.pem;

    # HSTS and Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Web App (React/Vite built files)
    root /var/www/RestaurantSystem/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    # API Proxy
    location /api/ {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO Proxy
    location /socket.io/ {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

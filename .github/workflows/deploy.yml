name: Deploy to EC2 Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: |
          # npm run test (Uncomment when tests are added)
          echo "Tests passed"

      - name: Build Web App (Vite)
        run: npm run build
        working-directory: ./apps/web

      - name: Build Backend App
        run: npm run build
        working-directory: ./apps/backend

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/RestaurantSystem
            
            # Pull latest code
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Rebuild locally on EC2 (or sync dist folders using rsync, but building on EC2 is acceptable for this setup)
            npm run build -w @restaurant/web
            npm run build -w @restaurant/backend
            
            # Fetch env vars from AWS SSM and write to .env (Needs AWS CLI configured on EC2 role)
            aws ssm get-parameter --with-decryption --name /restaurant/prod/env --query Parameter.Value --output text > apps/backend/.env
            
            # Run any db migrations if needed
            # npm run migrate
            
            # Reload PM2 with zero downtime
            cd apps/backend
            pm2 reload ecosystem.config.js --update-env
            pm2 save

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: indian_restaurant_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=restaurant_db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: indian_restaurant_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
